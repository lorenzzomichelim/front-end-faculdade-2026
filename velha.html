<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha - React</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      margin: 20px;
      padding: 0;
      background-color: #f0f0f0;
    }

    .square {
      background: #fff;
      border: 1px solid #999;
      float: left;
      font-size: 24px;
      font-weight: bold;
      line-height: 34px;
      height: 34px;
      margin-right: -1px;
      margin-top: -1px;
      padding: 0;
      text-align: center;
      width: 34px;
      cursor: pointer;
    }

    .square:focus {
      outline: none;
      background: #ddd;
    }

    .board-row:after {
      clear: both;
      content: '';
      display: table;
    }

    .game {
      display: flex;
      flex-direction: row;
      justify-content: center;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, StrictMode } = React;
    const { createRoot } = ReactDOM;

    // Componente Square reescrito como Arrow Function
    const Square = () => {
      const [value, setValue] = useState(null);

      const handleClick = () => {
        if (!value) {
          setValue('X');
        }
      };

      return (
        <button className="square" onClick={handleClick}>
          {value}
        </button>
      );
    };

    // Componente Board reescrito como Arrow Function
    const Board = () => {
      return (
        <div className="game">
          <div>
            <div className="board-row">
              <Square />
              <Square />
              <Square />
            </div>
            <div className="board-row">
              <Square />
              <Square />
              <Square />
            </div>
            <div className="board-row">
              <Square />
              <Square />
              <Square />
            </div>
          </div>
        </div>
      );
    };

    // Renderização do app na div #root
    const rootElement = document.getElementById("root");
    const root = createRoot(rootElement);
    
    root.render(
      <StrictMode>
        <Board />
      </StrictMode>
    );
  </script>

</body>
</html>
